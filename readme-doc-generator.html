<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231c1917'/></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-php.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg: #e7e5e0;
            --pane: #ffffff;
            --line: #ddd9d1;
            --ink: #1c1917;
            --muted: #78716c;
            --accent: #1d4ed8;
            --editor-bg: #171717;
            --editor-ink: #e7e5e4;
            --paper-shadow: 0 1px 2px rgba(28, 25, 23, 0.06), 0 12px 32px rgba(28, 25, 23, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: "Source Sans 3", system-ui, sans-serif;
        }

        .app {
            height: 100%;
            display: grid;
            grid-template-columns: minmax(280px, 2fr) minmax(380px, 3fr);
            gap: 10px;
            padding: 10px;
        }

        .pane {
            background: var(--pane);
            border: 1px solid var(--line);
            border-radius: 12px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .pane-bar {
            flex: 0 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 12px 0 16px;
            border-bottom: 1px solid var(--line);
            background: #fafaf8;
        }

        .path-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            background: #fafaf8;
        }

        .path-input {
            flex: 1;
            min-width: 0;
            height: 32px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            padding: 0 10px;
            color: #1c1917;
            font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            font-size: 12px;
            outline: none;
        }

        .path-input:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .path-input::placeholder { color: #a8a29e; }

        .pane-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .pane-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            appearance: none;
            border: 1px solid var(--line);
            background: #fff;
            color: #44403c;
            height: 30px;
            padding: 0 10px;
            border-radius: 8px;
            font: 600 12px/1 "Source Sans 3", system-ui, sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover { background: #f5f5f4; }
        .btn:active { transform: translateY(1px); }
        .btn svg { width: 14px; height: 14px; }

        .btn-icon {
            width: 30px;
            padding: 0;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .zoom-group {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 2px;
        }

        .zoom-group .btn {
            border: 0;
            height: 26px;
            width: 26px;
            padding: 0;
            background: transparent;
            border-radius: 6px;
        }

        .zoom-group .btn:hover { background: #f5f5f4; }

        .zoom-label {
            min-width: 48px;
            text-align: center;
            font-size: 12px;
            font-weight: 650;
            color: #44403c;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
        }

        .input-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            background: var(--editor-bg);
        }

        #markdown-input {
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--editor-ink);
            padding: 18px 18px 24px;
            font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13.5px;
            line-height: 1.65;
            tab-size: 2;
        }

        #markdown-input::placeholder { color: #737373; }

        .drop-mask {
            display: none;
            position: absolute;
            inset: 8px;
            border: 1.5px dashed #a8a29e;
            border-radius: 10px;
            background: rgba(23, 23, 23, 0.88);
            color: #f5f5f4;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrap.dragover .drop-mask { display: flex; }

        .preview-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #efece6;
        }

        .preview-scale {
            min-height: 100%;
            padding: 22px 18px 40px;
        }

        .doc {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 10px;
            box-shadow: var(--paper-shadow);
            padding: 44px 52px 56px;
            min-height: calc(100% - 8px);
            color: #1c1917;
            font-size: 16.5px;
            line-height: 1.72;
        }

        .doc.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a8a29e;
            font-size: 15px;
            min-height: 280px;
            box-shadow: none;
        }

        .fm-card {
            background: #f7f6f3;
            border: 1px solid #ebe7e0;
            border-radius: 10px;
            padding: 14px 16px 15px;
            margin: 0 0 28px;
        }

        .fm-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #a8a29e;
            margin-bottom: 4px;
        }

        .fm-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
        }

        .fm-overview {
            margin: 0;
            color: #57534e;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .doc h1, .doc h2, .doc h3, .doc h4 {
            line-height: 1.28;
            letter-spacing: -0.025em;
            color: #0c0a09;
            scroll-margin-top: 16px;
        }

        .doc h1 {
            font-size: 1.85rem;
            font-weight: 700;
            margin: 0 0 0.7em;
            padding-bottom: 0.42em;
            border-bottom: 1px solid #e7e5e4;
        }

        .doc h2 {
            font-size: 1.32rem;
            font-weight: 700;
            margin: 2.1em 0 0.7em;
            padding-bottom: 0.32em;
            border-bottom: 1px solid #f0eeec;
        }

        .doc h3 {
            font-size: 1.12rem;
            font-weight: 700;
            margin: 1.7em 0 0.55em;
        }

        .doc h4 {
            font-size: 1rem;
            font-weight: 700;
            margin: 1.4em 0 0.4em;
        }

        .doc p { margin: 0.85em 0; }

        .doc a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        .doc a:hover { color: #1e3a8a; }

        .doc ul, .doc ol {
            margin: 0.7em 0 1em;
            padding-left: 1.4em;
        }

        .doc ul { list-style: disc; }
        .doc ol { list-style: decimal; }
        .doc ul ul { list-style: circle; }
        .doc li { margin: 0.28em 0; }
        .doc li > ul, .doc li > ol { margin: 0.2em 0 0.4em; }

        .doc hr {
            border: 0;
            height: 1px;
            background: #e7e5e4;
            margin: 2em 0;
        }

        .doc blockquote {
            margin: 1.1em 0;
            padding: 0.15em 0 0.15em 1em;
            border-left: 3px solid #d6d3d1;
            color: #57534e;
        }

        .doc blockquote p { margin: 0.4em 0; }

        .doc strong { font-weight: 700; }

        .doc code:not(pre code) {
            font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            font-size: 0.84em;
            background: #f4f1ea;
            border: 1px solid #ebe6dc;
            color: #9a3412;
            padding: 0.08em 0.38em;
            border-radius: 5px;
            white-space: nowrap;
        }

        .code-block {
            margin: 1.15em 0;
            background: #1c1917;
            border-radius: 10px;
            overflow: hidden;
        }

        .code-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 8px 0 14px;
        }

        .code-lang {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #a8a29e;
        }

        .copy-btn {
            appearance: none;
            border: 0;
            background: #292524;
            color: #e7e5e4;
            height: 26px;
            padding: 0 9px;
            border-radius: 6px;
            font: 600 11px/1 "Source Sans 3", system-ui, sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover { background: #44403c; }
        .copy-btn.is-copied { background: #166534; color: #dcfce7; }
        .copy-btn svg { width: 12px; height: 12px; }

        .doc pre {
            margin: 1.15em 0;
            padding: 14px 16px;
            background: #1c1917;
            color: #f5f5f4;
            border-radius: 10px;
            overflow-x: auto;
            font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            font-size: 13px;
            line-height: 1.55;
        }

        .code-block pre {
            margin: 0;
            border-radius: 0;
            padding-top: 10px;
        }

        .doc pre code {
            font-family: inherit;
            font-size: inherit;
            background: transparent;
            color: inherit;
            padding: 0;
            border: 0;
            white-space: pre;
        }

        .doc pre[class*="language-"],
        .doc code[class*="language-"] {
            background: #1c1917;
            text-shadow: none;
            color: #f5f5f4;
        }

        .doc .token.operator,
        .doc .token.entity,
        .doc .token.url {
            background: none;
        }

        .table-wrap {
            margin: 1.2em 0;
            overflow-x: auto;
            border: 1px solid #e7e5e4;
            border-radius: 10px;
        }

        .doc table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .doc th, .doc td {
            text-align: left;
            vertical-align: top;
            padding: 10px 12px;
            border-bottom: 1px solid #eceae6;
            word-break: break-word;
        }

        .doc th {
            background: #f7f6f3;
            font-weight: 700;
            color: #1c1917;
            white-space: nowrap;
        }

        .doc th:first-child,
        .doc td:first-child {
            min-width: 11.5rem;
            font-weight: 650;
        }

        .doc tr:last-child td { border-bottom: 0; }
        .doc tbody tr:nth-child(even) td { background: #fafaf8; }

        .doc img { max-width: 100%; height: auto; }

        .doc .task-list-item {
            list-style: none;
            margin-left: -1.2em;
        }

        .doc .task-list-item input {
            margin-right: 0.45em;
            accent-color: var(--accent);
        }

        .mermaid-wrap {
            margin: 1.3em 0;
            background: #f7f6f3;
            border: 1px solid #ebe7e0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .mermaid-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 8px 0 12px;
        }

        .mermaid-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #a8a29e;
        }

        .diagram-fs-btn {
            appearance: none;
            border: 1px solid #e7e5e4;
            background: #fff;
            color: #44403c;
            height: 26px;
            padding: 0 8px;
            border-radius: 6px;
            font: 600 11px/1 "Source Sans 3", system-ui, sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .diagram-fs-btn:hover { background: #f5f5f4; }
        .diagram-fs-btn svg { width: 12px; height: 12px; }

        .mermaid-canvas {
            padding: 8px 14px 16px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .mermaid-wrap svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .mermaid-error {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 12px;
            color: #b91c1c;
            white-space: pre-wrap;
        }

        .diagram-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 80;
            background: #eceae4;
            flex-direction: column;
        }

        .diagram-overlay.is-open { display: flex; }

        .diagram-overlay-bar {
            flex: 0 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 12px 0 16px;
            border-bottom: 1px solid var(--line);
            background: #fafaf8;
        }

        .diagram-overlay-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 24px;
            background: #f7f6f3;
        }

        .diagram-overlay-scale {
            min-height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .diagram-overlay-scale svg {
            display: block;
            width: min(100%, 1500px);
            height: auto;
            max-width: none;
        }

        .preview-pane.fullscreen {
            position: fixed;
            inset: 8px;
            z-index: 50;
            border-radius: 12px;
            box-shadow: 0 24px 64px rgba(28, 25, 23, 0.28);
        }

        body.fs-on,
        body.diagram-fs-on { overflow: hidden; }

        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1.4fr;
            }
            .doc { padding: 28px 22px 36px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <section class="pane" id="input-pane">
            <div class="pane-bar">
                <div class="pane-title">Input</div>
                <div class="pane-actions">
                    <label class="btn" for="file-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                        Open
                    </label>
                    <input id="file-input" type="file" accept=".md,.txt,.markdown,.mdx,.plan.md" hidden>
                    <button class="btn" type="button" id="clear-btn">Clear</button>
                </div>
            </div>
            <div class="path-row">
                <input class="path-input" id="path-input" type="text" spellcheck="false" placeholder="Paste a file path and press Enter">
                <button class="btn" type="button" id="load-path-btn">Load</button>
            </div>
            <div class="input-wrap" id="input-wrap">
                <textarea id="markdown-input" spellcheck="false" placeholder="Paste markdown, a file path, or drop a .md file."></textarea>
                <div class="drop-mask">Drop markdown file</div>
            </div>
        </section>

        <section class="pane preview-pane" id="preview-pane">
            <div class="pane-bar">
                <div class="pane-title">Live output</div>
                <div class="pane-actions">
                    <div class="zoom-group" title="Preview size">
                        <button class="btn" type="button" id="zoom-out" aria-label="Zoom out">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M8 11h6"/></svg>
                        </button>
                        <span class="zoom-label" id="zoom-label" title="Reset zoom">100%</span>
                        <button class="btn" type="button" id="zoom-in" aria-label="Zoom in">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
                        </button>
                    </div>
                    <button class="btn btn-icon" type="button" id="fullscreen-btn" aria-label="Toggle fullscreen preview" title="Fullscreen">
                        <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                    </button>
                </div>
            </div>
            <div class="preview-scroll" id="preview-scroll">
                <div class="preview-scale" id="preview-scale">
                    <article class="doc empty" id="preview-doc">Paste or drop markdown to preview</article>
                </div>
            </div>
        </section>
    </div>

    <div class="diagram-overlay" id="diagram-overlay">
        <div class="diagram-overlay-bar">
            <div class="pane-title">Diagram</div>
            <div class="pane-actions">
                <div class="zoom-group" title="Diagram size">
                    <button class="btn" type="button" id="diagram-zoom-out" aria-label="Zoom out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M8 11h6"/></svg>
                    </button>
                    <span class="zoom-label" id="diagram-zoom-label" title="Reset zoom">100%</span>
                    <button class="btn" type="button" id="diagram-zoom-in" aria-label="Zoom in">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
                    </button>
                </div>
                <button class="btn" type="button" id="diagram-overlay-close">Close</button>
            </div>
        </div>
        <div class="diagram-overlay-body">
            <div class="diagram-overlay-scale" id="diagram-overlay-scale"></div>
        </div>
    </div>

    <script>
        const ZOOM_MIN = 0.7;
        const ZOOM_MAX = 1.8;
        const ZOOM_STEP = 0.1;

        const els = {
            input: document.getElementById('markdown-input'),
            doc: document.getElementById('preview-doc'),
            scale: document.getElementById('preview-scale'),
            scroll: document.getElementById('preview-scroll'),
            pane: document.getElementById('preview-pane'),
            wrap: document.getElementById('input-wrap'),
            file: document.getElementById('file-input'),
            zoomLabel: document.getElementById('zoom-label'),
            zoomIn: document.getElementById('zoom-in'),
            zoomOut: document.getElementById('zoom-out'),
            fsBtn: document.getElementById('fullscreen-btn'),
            clearBtn: document.getElementById('clear-btn'),
            path: document.getElementById('path-input'),
            loadPath: document.getElementById('load-path-btn'),
            diagramOverlay: document.getElementById('diagram-overlay'),
            diagramScale: document.getElementById('diagram-overlay-scale'),
            diagramClose: document.getElementById('diagram-overlay-close'),
            diagramZoomIn: document.getElementById('diagram-zoom-in'),
            diagramZoomOut: document.getElementById('diagram-zoom-out'),
            diagramZoomLabel: document.getElementById('diagram-zoom-label')
        };

        let zoom = 1;
        let diagramZoom = 1;
        let renderGen = 0;
        let pathRequest = 0;
        let loadedPath = '';
        const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>`;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function debounce(fn, wait) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), wait);
            };
        }

        function splitFrontmatter(markdown) {
            const match = markdown.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
            if (!match) return { meta: null, body: markdown };
            const raw = match[1];
            const name = (raw.match(/^name:\s*(.+)$/m) || [])[1];
            let overview = (raw.match(/^overview:\s*(.+)$/m) || [])[1];
            if (overview) {
                overview = overview.trim().replace(/^["']|["']$/g, '');
            }
            return {
                meta: { name: name ? name.trim() : '', overview: overview || '' },
                body: match[2]
            };
        }

        function codeParts(token, infostring) {
            if (typeof token === 'string') {
                return { text: token, lang: infostring || '' };
            }
            return { text: token?.text || '', lang: token?.lang || '' };
        }

        marked.use({
            gfm: true,
            breaks: false,
            renderer: {
                code(token, infostring) {
                    const { text, lang } = codeParts(token, infostring);
                    const language = String(lang || '').trim().split(/\s+/)[0];
                    if (language === 'mermaid') {
                        return `<div class="mermaid-wrap">
                            <div class="mermaid-bar">
                                <span class="mermaid-label">Diagram</span>
                                <button type="button" class="diagram-fs-btn" title="Fullscreen">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                                    Fullscreen
                                </button>
                            </div>
                            <div class="mermaid-canvas"><pre class="mermaid">${escapeHtml(text)}</pre></div>
                        </div>`;
                    }
                    const cls = language ? `language-${language}` : 'language-none';
                    const label = language || 'code';
                    return `<div class="code-block">
                        <div class="code-bar">
                            <span class="code-lang">${escapeHtml(label)}</span>
                            <button type="button" class="copy-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>
                                Copy
                            </button>
                        </div>
                        <pre><code class="${cls}">${escapeHtml(text)}</code></pre>
                    </div>\n`;
                }
            }
        });

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'base',
            fontFamily: 'Source Sans 3, system-ui, sans-serif',
            themeVariables: {
                fontFamily: 'Source Sans 3, system-ui, sans-serif',
                fontSize: '15px',
                primaryColor: '#eef2ff',
                primaryTextColor: '#1c1917',
                primaryBorderColor: '#6366f1',
                lineColor: '#57534e',
                secondaryColor: '#f7f6f3',
                tertiaryColor: '#ffffff',
                noteBkgColor: '#fff7ed',
                noteTextColor: '#7c2d12',
                noteBorderColor: '#fdba74',
                actorBkg: '#ffffff',
                actorBorder: '#a5b4fc',
                actorTextColor: '#1c1917',
                signalColor: '#44403c',
                signalTextColor: '#1c1917',
                labelBoxBkgColor: '#f5f5f4',
                labelTextColor: '#1c1917',
                clusterBkg: '#f7f6f3',
                clusterBorder: '#d6d3d1',
                edgeLabelBackground: '#ffffff'
            },
            flowchart: { htmlLabels: true, useMaxWidth: true, padding: 12, curve: 'basis' },
            sequence: {
                useMaxWidth: true,
                actorMargin: 18,
                messageMargin: 32,
                boxMargin: 8,
                noteMargin: 10,
                width: 175,
                wrap: false
            }
        });

        function wrapTables(root) {
            root.querySelectorAll('table').forEach((table) => {
                if (table.parentElement.classList.contains('table-wrap')) return;
                const wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        function styleTaskLists(root) {
            root.querySelectorAll('input[type="checkbox"]').forEach((box) => {
                const li = box.closest('li');
                if (li) li.classList.add('task-list-item');
                box.disabled = true;
            });
        }

        async function renderMermaid(root, gen) {
            const nodes = [...root.querySelectorAll('.mermaid')];
            if (!nodes.length || !window.mermaid) return;
            for (let i = 0; i < nodes.length; i += 1) {
                if (gen !== renderGen) return;
                const node = nodes[i];
                const def = node.textContent.trim();
                const wrap = node.closest('.mermaid-wrap') || node;
                const canvas = wrap.querySelector('.mermaid-canvas') || wrap;
                wrap.dataset.source = def;
                try {
                    const id = `mermaid-${gen}-${i}`;
                    const { svg } = await mermaid.render(id, def);
                    if (gen !== renderGen) return;
                    canvas.innerHTML = svg;
                } catch (err) {
                    canvas.innerHTML = `<div class="mermaid-error">Diagram could not be rendered.</div>`;
                }
            }
        }

        function metaHtml(meta) {
            if (!meta || (!meta.name && !meta.overview)) return '';
            return `<aside class="fm-card">
                <div class="fm-kicker">Document</div>
                ${meta.name ? `<div class="fm-title">${escapeHtml(meta.name)}</div>` : ''}
                ${meta.overview ? `<p class="fm-overview">${escapeHtml(meta.overview)}</p>` : ''}
            </aside>`;
        }

        function looksLikeFilePath(text) {
            const t = String(text || '').trim();
            if (!t || t.includes('\n') || t.includes('\r')) return false;
            return /^(~\/|\/).+\.(md|markdown|txt|mdx)$/i.test(t);
        }

        function showPreviewMessage(message) {
            els.doc.className = 'doc empty';
            els.doc.textContent = message;
        }

        async function loadFromPath(path, { intoTextarea } = { intoTextarea: true }) {
            const trimmed = String(path || '').trim();
            if (!trimmed) {
                showPreviewMessage('Paste a file path to load');
                return;
            }

            const req = ++pathRequest;
            els.loadPath.disabled = true;
            showPreviewMessage('Loading file…');

            try {
                const url = new URL('read-file.php', window.location.href);
                url.searchParams.set('path', trimmed);
                const res = await fetch(url.toString(), { cache: 'no-store' });
                const data = await res.json().catch(() => null);
                if (req !== pathRequest) return;
                if (!data || !data.ok) {
                    showPreviewMessage((data && data.error) || 'Could not read that file');
                    return;
                }
                loadedPath = data.path || trimmed;
                els.path.value = loadedPath;
                els.path.title = loadedPath;
                if (intoTextarea) {
                    els.input.value = data.content;
                }
                await renderMarkdown(data.content);
            } catch (err) {
                if (req !== pathRequest) return;
                showPreviewMessage('Could not read that file');
            } finally {
                if (req === pathRequest) els.loadPath.disabled = false;
            }
        }

        async function renderPreview() {
            const source = els.input.value;
            const trimmed = source.trim();

            if (!trimmed) {
                loadedPath = '';
                showPreviewMessage('Paste or drop markdown to preview');
                return;
            }

            if (looksLikeFilePath(trimmed) && trimmed !== loadedPath) {
                els.path.value = trimmed;
                await loadFromPath(trimmed);
                return;
            }

            await renderMarkdown(source);
        }

        async function renderMarkdown(source) {
            const gen = ++renderGen;
            const y = els.scroll.scrollTop;
            const trimmed = String(source || '').trim();

            if (!trimmed) {
                showPreviewMessage('Paste or drop markdown to preview');
                return;
            }

            const { meta, body } = splitFrontmatter(source);
            let html = '';
            try {
                html = metaHtml(meta) + marked.parse(body);
            } catch (err) {
                html = `<p>Could not parse markdown.</p><pre><code>${escapeHtml(String(err))}</code></pre>`;
            }

            els.doc.className = 'doc';
            els.doc.innerHTML = html;
            wrapTables(els.doc);
            styleTaskLists(els.doc);

            els.doc.querySelectorAll('a[href]').forEach((a) => {
                a.setAttribute('rel', 'noopener noreferrer');
            });

            if (window.Prism) Prism.highlightAllUnder(els.doc);
            await renderMermaid(els.doc, gen);
            if (gen === renderGen) els.scroll.scrollTop = y;
        }

        function applyZoom() {
            zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(zoom * 10) / 10));
            els.scale.style.zoom = String(zoom);
            els.zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
            els.zoomOut.disabled = zoom <= ZOOM_MIN;
            els.zoomIn.disabled = zoom >= ZOOM_MAX;
        }

        function setZoom(next) {
            zoom = next;
            applyZoom();
        }

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                els.input.value = String(reader.result || '');
                renderPreview();
            };
            reader.readAsText(file);
        }

        function toggleFullscreen() {
            const on = !els.pane.classList.contains('fullscreen');
            els.pane.classList.toggle('fullscreen', on);
            document.body.classList.toggle('fs-on', on);
            els.fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
        }

        async function copyCode(btn) {
            const block = btn.closest('.code-block');
            const code = block && block.querySelector('code');
            const text = code ? code.textContent : '';
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
            }
            btn.classList.add('is-copied');
            btn.innerHTML = `${copyIcon} Copied`;
            setTimeout(() => {
                btn.classList.remove('is-copied');
                btn.innerHTML = `${copyIcon} Copy`;
            }, 1400);
        }

        function applyDiagramZoom() {
            diagramZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(diagramZoom * 10) / 10));
            els.diagramScale.style.zoom = String(diagramZoom);
            els.diagramZoomLabel.textContent = `${Math.round(diagramZoom * 100)}%`;
            els.diagramZoomOut.disabled = diagramZoom <= ZOOM_MIN;
            els.diagramZoomIn.disabled = diagramZoom >= ZOOM_MAX;
        }

        function openDiagram(wrap) {
            const svg = wrap.querySelector('.mermaid-canvas svg');
            if (!svg) return;
            const clone = svg.cloneNode(true);
            clone.removeAttribute('width');
            clone.removeAttribute('height');
            clone.style.width = 'min(100%, 1500px)';
            clone.style.height = 'auto';
            clone.style.maxWidth = 'none';
            els.diagramScale.innerHTML = '';
            els.diagramScale.appendChild(clone);
            diagramZoom = 1;
            applyDiagramZoom();
            els.diagramOverlay.classList.add('is-open');
            document.body.classList.add('diagram-fs-on');
        }

        function closeDiagram() {
            els.diagramOverlay.classList.remove('is-open');
            document.body.classList.remove('diagram-fs-on');
            els.diagramScale.innerHTML = '';
        }

        els.input.addEventListener('input', debounce(renderPreview, 160));
        els.loadPath.addEventListener('click', () => loadFromPath(els.path.value));
        els.path.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadFromPath(els.path.value);
            }
        });
        els.path.addEventListener('paste', () => {
            setTimeout(() => {
                if (looksLikeFilePath(els.path.value)) loadFromPath(els.path.value);
            }, 0);
        });
        els.zoomIn.addEventListener('click', () => setZoom(zoom + ZOOM_STEP));
        els.zoomOut.addEventListener('click', () => setZoom(zoom - ZOOM_STEP));
        els.zoomLabel.addEventListener('click', () => setZoom(1));
        els.fsBtn.addEventListener('click', toggleFullscreen);
        els.doc.addEventListener('click', (e) => {
            const copyBtn = e.target.closest('.copy-btn');
            if (copyBtn) {
                e.preventDefault();
                copyCode(copyBtn);
                return;
            }
            const diagramBtn = e.target.closest('.diagram-fs-btn');
            if (diagramBtn) {
                e.preventDefault();
                const wrap = diagramBtn.closest('.mermaid-wrap');
                if (wrap) openDiagram(wrap);
            }
        });
        els.diagramClose.addEventListener('click', closeDiagram);
        els.diagramZoomIn.addEventListener('click', () => {
            diagramZoom += ZOOM_STEP;
            applyDiagramZoom();
        });
        els.diagramZoomOut.addEventListener('click', () => {
            diagramZoom -= ZOOM_STEP;
            applyDiagramZoom();
        });
        els.diagramZoomLabel.addEventListener('click', () => {
            diagramZoom = 1;
            applyDiagramZoom();
        });
        els.clearBtn.addEventListener('click', () => {
            loadedPath = '';
            pathRequest += 1;
            els.input.value = '';
            els.path.value = '';
            renderPreview();
            els.path.focus();
        });
        els.file.addEventListener('change', () => {
            if (els.file.files[0]) readFile(els.file.files[0]);
            els.file.value = '';
        });

        ['dragenter', 'dragover'].forEach((type) => {
            els.wrap.addEventListener(type, (e) => {
                e.preventDefault();
                els.wrap.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach((type) => {
            els.wrap.addEventListener(type, (e) => {
                e.preventDefault();
                if (type === 'drop' && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
                els.wrap.classList.remove('dragover');
            });
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const mod = e.metaKey || e.ctrlKey;
            const diagramOpen = els.diagramOverlay.classList.contains('is-open');
            if (key === 'Escape') {
                if (diagramOpen) {
                    closeDiagram();
                    return;
                }
                if (els.pane.classList.contains('fullscreen')) toggleFullscreen();
                return;
            }
            if (mod && (key === '=' || key === '+')) {
                e.preventDefault();
                if (diagramOpen) {
                    diagramZoom += ZOOM_STEP;
                    applyDiagramZoom();
                } else {
                    setZoom(zoom + ZOOM_STEP);
                }
            } else if (mod && key === '-') {
                e.preventDefault();
                if (diagramOpen) {
                    diagramZoom -= ZOOM_STEP;
                    applyDiagramZoom();
                } else {
                    setZoom(zoom - ZOOM_STEP);
                }
            } else if (mod && key === '0') {
                e.preventDefault();
                if (diagramOpen) {
                    diagramZoom = 1;
                    applyDiagramZoom();
                } else {
                    setZoom(1);
                }
            }
        });

        window.setMarkdown = (md) => {
            els.input.value = md;
            return renderPreview();
        };

        applyZoom();
        renderPreview();
    </script>
</body>
</html>
